<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pulau-Pulau Kecil Terluar Indonesia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
}

#header {
  height: 60px;
  background: white;
  display: flex;
  align-items: center;
  padding: 0 16px;
  border-bottom: 1px solid #ddd;
  position: relative;
  z-index: 1000;
}

#logo {
  height: 40px;
  margin-right: 15px;
}

#title {
  flex: 1;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

#map {
  height: calc(100vh - 60px);
  width: 100%;
}

/* ===== LABEL NAMA PULAU ===== */
.pulau-label {
  background: rgba(255,255,255,0.9);
  color: #000;
  font-size: 11px;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 4px;
  white-space: nowrap;
  border: 1px solid #555;
  box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  transform: translate(-50%, -120%);
}
</style>
</head>

<body>

<div id="header">
  <img src="LogoKKP.png" id="logo">
  <div id="title">Pulau-Pulau Kecil Terluar Indonesia</div>
</div>

<div id="map"></div>

<!-- JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ===============================
// MAP
// ===============================
var map = L.map('map').setView([-2.5, 118], 5);

// ===============================
// BASEMAP
// ===============================
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// ===============================
// ICON TAG
// ===============================
var tagIcon = L.icon({
  iconUrl: "https://cdn-icons-png.flaticon.com/512/684/684908.png",
  iconSize: [22, 22],
  iconAnchor: [11, 22],
  popupAnchor: [0, -20]
});

// ===============================
// GEOJSON
// ===============================
fetch("https://raw.githubusercontent.com/ali-farkhan/webgis/main/PPKT.geojson")
.then(res => res.json())
.then(data => {

  var geojsonLayer = L.geoJSON(data, {
    style: {
      color: "#1d3557",
      weight: 1.5,
      fillOpacity: 0.5
    },

    onEachFeature: function (feature, layer) {

      let popup = "<b>Informasi Pulau</b><hr>";
      for (let k in feature.properties) {
        popup += `<b>${k}</b> : ${feature.properties[k] ?? "-"}<br>`;
      }
      layer.bindPopup(popup);

      // ===== CENTROID =====
      var center = layer.getBounds().getCenter();

      // ===== MARKER ICON =====
      L.marker(center, { icon: tagIcon }).addTo(map);

      // ===== LABEL NAMA PULAU =====
      var namaPulau = feature.properties.NAMA_PULAU || "Tanpa Nama";

      var labelIcon = L.divIcon({
        className: '',
        html: `<div class="pulau-label">${namaPulau}</div>`,
        iconSize: [0, 0],
        iconAnchor: [0, 0]
      });

      L.marker(center, {
        icon: labelIcon,
        interactive: false   // label tidak mengganggu klik
      }).addTo(map);

      layer.on({
        mouseover: e => e.target.setStyle({ color: "#e63946", weight: 3 }),
        mouseout: e => geojsonLayer.resetStyle(e.target)
      });
    }
  }).addTo(map);

  map.fitBounds(geojsonLayer.getBounds());
});
</script>

</body>
</html>
